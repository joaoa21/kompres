[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Arquivos gerados pelo Astro têm hash no nome: podem ficar em cache para sempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Um endereço só para o Google: o domínio da Netlify e o www vão direto (301) para
# https://kompres.com.br, sem cadeia http://www -> https://www -> domínio.
# As prévias de PR (deploy-preview-N--kompres-app.netlify.app) têm outro endereço e continuam abrindo.
[[redirects]]
  from = "https://kompres-app.netlify.app/*"
  to = "https://kompres.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kompres-app.netlify.app/*"
  to = "https://kompres.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.kompres.com.br/*"
  to = "https://kompres.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kompres.com.br/*"
  to = "https://kompres.com.br/:splat"
  status = 301
  force = true
